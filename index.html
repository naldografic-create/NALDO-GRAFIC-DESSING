<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NALDO GRAFIC DESIGNER (NGD) 2026</title>
    <!-- PWA Manifest Embebido -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22NALDO%20GRAFIC%20DESIGNER%202026%22%2C%22short_name%22%3A%22NGD%202026%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0a0a%22%2C%22theme_color%22%3A%22%23ff6600%22%2C%22icons%22%3A%5B%5D%7D">
    <style>
        :root {
            --bg-main: #0a0a0a;
            --panel-bg: #141414;
            --panel-border: #262626;
            --accent: #ff6600;
            --accent-glow: rgba(255, 102, 0, 0.4);
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --canvas-bg: #181818;
        }

        [data-theme="dark-neon"] {
            --bg-main: #020617;
            --panel-bg: #0f172a;
            --panel-border: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        [data-theme="tech-gray"] {
            --bg-main: #18181b;
            --panel-bg: #27272a;
            --panel-border: #3f3f46;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
        }

        [data-theme="studio-white"] {
            --bg-main: #f1f5f9;
            --panel-bg: #ffffff;
            --panel-border: #cbd5e1;
            --accent: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.4);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --canvas-bg: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Modal Inicial Configuración Lienzo */
        #setup-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            box-shadow: 0 0 35px var(--accent-glow);
        }
        .modal-content h2 {
            color: var(--accent);
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: var(--bg-main);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Header Principal */
        header {
            height: 55px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 800;
        }
        .brand span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .top-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .tool-btn {
            background: var(--bg-main);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .tool-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Workspace Principal */
        .workspace-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Herramientas */
        sidebar {
            width: 290px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 5;
        }
        .section-box {
            padding: 15px;
            border-bottom: 1px solid var(--panel-border);
        }
        .section-box h3 {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .action-btn {
            background: var(--bg-main);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .action-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Visor y Lienzo */
        .canvas-viewport {
            flex: 1;
            background: var(--canvas-bg);
            position: relative;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }
        #artboard {
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,102,0,0.3);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .canvas-element {
            position: absolute;
            cursor: move;
            border: 2px dashed transparent;
        }
        .canvas-element.selected {
            border-color: var(--accent);
        }
        .resize-handle {
            position: absolute;
            width: 12px; height: 12px;
            background: var(--accent);
            bottom: -6px; right: -6px;
            cursor: se-resize;
            display: none;
            border-radius: 50%;
        }
        .canvas-element.selected .resize-handle {
            display: block;
        }

        /* Panel Derecho: Capas e Info */
        .right-panel {
            width: 250px;
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 5;
        }
        .layers-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .layer-item {
            padding: 8px 10px;
            background: var(--bg-main);
            border: 1px solid var(--panel-border);
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .layer-item.active {
            border-color: var(--accent);
            background: rgba(255,102,0,0.08);
        }

        /* Barra de Estado Inferior */
        footer {
            height: 30px;
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 10;
        }
    </style>
</head>
<body data-theme="default">

    <!-- MODAL INICIAL CONFIGURACIÓN LIENZO -->
    <div id="setup-modal">
        <div class="modal-content">
            <h2>NALDO GRAFIC DESIGNER (NGD) 2026</h2>
            <div class="form-group">
                <label>Unidad de Medida:</label>
                <select id="init-unit">
                    <option value="cm">Centímetros (cm)</option>
                    <option value="mm">Milímetros (mm)</option>
                    <option value="px">Píxeles (px)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ancho del Lienzo:</label>
                <input type="number" id="init-width" value="40" min="1" max="500">
            </div>
            <div class="form-group">
                <label>Alto del Lienzo:</label>
                <input type="number" id="init-height" value="50" min="1" max="500">
            </div>
            <div class="form-group">
                <label>Resolución (DPI):</label>
                <select id="init-dpi">
                    <option value="72">72 DPI (Web)</option>
                    <option value="150">150 DPI (Estándar)</option>
                    <option value="300" selected>300 DPI (Alta Calidad / DTF)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color de Fondo del Lienzo:</label>
                <select id="init-bg-color">
                    <option value="#ffffff">Blanco</option>
                    <option value="#000000">Negro</option>
                    <option value="transparent">Transparente</option>
                    <option value="#808080">Gris Neutro</option>
                </select>
            </div>
            <button class="btn-primary" onclick="initArtboard()">CREAR LIENZO DE TRABAJO</button>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="brand">
            <h1>NALDO GRAFIC</h1>
            <span>NGD 2026</span>
        </div>
        <div class="top-toolbar">
            <button class="tool-btn" onclick="undo()" title="Deshacer (Hasta 300 niveles)">↩ Deshacer (<span id="undo-count">0</span>)</button>
            <button class="tool-btn" onclick="redo()" title="Rehacer">↪ Rehacer (<span id="redo-count">0</span>)</button>
            <button class="tool-btn" onclick="cycleTheme()">🎨 Tema</button>
            <button class="tool-btn" onclick="document.getElementById('import-file').click()">📂 Importar</button>
            <input type="file" id="import-file" style="display:none" accept="image/*" onchange="importImage(event)">
            <button class="tool-btn" onclick="exportDocument('png')" style="background:var(--accent); color:#000; font-weight:bold;">💾 Descargar PNG</button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="workspace-container">
        <!-- SIDEBAR DE HERRAMIENTAS -->
        <sidebar>
            <div class="section-box">
                <h3>Edición y Procesamiento</h3>
                <div class="btn-grid">
                    <button class="action-btn" onclick="removeBackground()">Quitar Fondo</button>
                    <button class="action-btn" onclick="openCropTool()">Recortar Imagen</button>
                    <button class="action-btn" onclick="applyVectorize()">Convertir a Vector</button>
                    <button class="action-btn" onclick="applyPixelate()">Convertir a Píxeles</button>
                    <button class="action-btn" onclick="applyHalftones()">Semitonos Prof.</button>
                    <button class="action-btn" onclick="applyUpscaler()">Upscaler IA</button>
                </div>
            </div>

            <div class="section-box">
                <h3>Reducción Choke / Semitransp.</h3>
                <div class="btn-grid">
                    <button class="action-btn" onclick="applyChoke(1)">Choke 1px</button>
                    <button class="action-btn" onclick="applyChoke(2)">Choke 2px</button>
                    <button class="action-btn" onclick="applyChoke(3)">Choke 3px</button>
                    <button class="action-btn" onclick="applyChoke(4)">Choke 4px</button>
                    <button class="action-btn" onclick="applyChoke(5)">Choke 5px</button>
                    <button class="action-btn" onclick="applyChoke(10)">Choke 10px</button>
                </div>
            </div>

            <div class="section-box">
                <h3>Sustitución de Color</h3>
                <div class="form-group" style="margin-bottom:8px;">
                    <label>Color a Reemplazar:</label>
                    <input type="color" id="target-color" value="#000000" style="height:35px; padding:2px;">
                </div>
                <div class="form-group" style="margin-bottom:8px;">
                    <label>Nuevo Color o Transparente:</label>
                    <div style="display:flex; gap:5px;">
                        <input type="color" id="new-color" value="#ff6600" style="height:35px; padding:2px; flex:1;">
                        <button class="action-btn" onclick="applyColorReplace(true)" style="flex:1;">Transparente</button>
                    </div>
                </div>
                <button class="action-btn" onclick="applyColorReplace(false)" style="width:100%;">Reemplazar Color</button>
            </div>

            <div class="section-box">
                <h3>Apoyo & Donaciones</h3>
                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Apoya vía PayPal:</p>
                <a href="mailto:arnaldojbg@gmail.com" style="color:var(--accent); font-size:0.85rem; word-break:break-all;">arnaldojbg@gmail.com</a>
            </div>
        </sidebar>

        <!-- LIENZO / ÁREA DE TRABAJO -->
        <div class="canvas-viewport" id="viewport">
            <div id="artboard"></div>
        </div>

        <!-- PANEL DERECHO (CAPAS & PROPIEDADES) -->
        <div class="right-panel">
            <div class="section-box" style="padding:10px; border-bottom:1px solid var(--panel-border);">
                <h3 style="margin-bottom:5px;">Capas Inteligentes</h3>
            </div>
            <div class="layers-list" id="layers-list"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div id="status-info">Lienzo listo | Guías dinámicas activas</div>
        <div id="element-metrics">Selecciona un elemento</div>
    </footer>

    <script>
        let artboardConfig = { width: 600, height: 800, unit: 'cm', dpi: 300, bgColor: '#ffffff' };
        let elements = [];
        let selectedElementId = null;
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 300;
        let themes = ['default', 'dark-neon', 'tech-gray', 'studio-white'];
        let currentThemeIndex = 0;

        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            let themeName = themes[currentThemeIndex];
            if(themeName === 'default') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', themeName);
            }
        }

        function initArtboard() {
            let u = document.getElementById('init-unit').value;
            let w = parseFloat(document.getElementById('init-width').value) || 40;
            let h = parseFloat(document.getElementById('init-height').value) || 50;
            let dpi = parseInt(document.getElementById('init-dpi').value) || 300;
            let bg = document.getElementById('init-bg-color').value;

            // Escala de trabajo cómoda en pantalla
            let pxWidth = u === 'cm' ? w * 25 : (u === 'mm' ? w * 2.5 : w);
            let pxHeight = u === 'cm' ? h * 25 : (u === 'mm' ? h * 2.5 : h);

            artboardConfig = { width: pxWidth, height: pxHeight, unit: u, dpi: dpi, bgColor: bg };
            
            let artboard = document.getElementById('artboard');
            artboard.style.width = pxWidth + 'px';
            artboard.style.height = pxHeight + 'px';
            artboard.style.backgroundColor = bg === 'transparent' ? '#ffffff' : bg;
            
            document.getElementById('setup-modal').style.display = 'none';
            saveState();
        }

        function saveState() {
            if (undoStack.length >= MAX_HISTORY) undoStack.shift();
            undoStack.push(JSON.stringify(elements));
            redoStack = [];
            updateHistoryCounters();
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(elements));
            let prevState = undoStack.pop();
            elements = JSON.parse(prevState);
            renderCanvas();
            updateHistoryCounters();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(elements));
            let nextState = redoStack.pop();
            elements = JSON.parse(nextState);
            renderCanvas();
            updateHistoryCounters();
        }

        function updateHistoryCounters() {
            document.getElementById('undo-count').innerText = undoStack.length;
            document.getElementById('redo-count').innerText = redoStack.length;
        }

        function importImage(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let imgObj = new Image();
                imgObj.src = e.target.result;
                imgObj.onload = function() {
                    // Calcular tamaño inicial proporcionado y centrado garantizado en la mesa de trabajo
                    let targetW = Math.min(imgObj.width, artboardConfig.width * 0.6);
                    let targetH = targetW * (imgObj.height / imgObj.width);
                    let centerX = (artboardConfig.width - targetW) / 2;
                    let centerY = (artboardConfig.height - targetH) / 2;

                    let newEl = {
                        id: 'el_' + Date.now(),
                        name: file.name,
                        type: 'image',
                        src: e.target.result,
                        x: Math.max(10, centerX),
                        y: Math.max(10, centerY),
                        width: targetW,
                        height: targetH
                    };
                    elements.push(newEl);
                    selectElement(newEl.id);
                    saveState();
                    renderCanvas();
                }
            }
            reader.readAsDataURL(file);
        }

        function renderCanvas() {
            let artboard = document.getElementById('artboard');
            artboard.innerHTML = '';
            let layersList = document.getElementById('layers-list');
            layersList.innerHTML = '';

            elements.forEach((el, index) => {
                let div = document.createElement('div');
                div.className = 'canvas-element ' + (el.id === selectedElementId ? 'selected' : '');
                div.style.left = el.x + 'px';
                div.style.top = el.y + 'px';
                div.style.width = el.width + 'px';
                div.style.height = el.height + 'px';
                div.dataset.id = el.id;

                let img = document.createElement('img');
                img.src = el.src;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.pointerEvents = 'none';
                div.appendChild(img);

                let handle = document.createElement('div');
                handle.className = 'resize-handle';
                div.appendChild(handle);

                // Movimiento libre (dentro y fuera del lienzo)
                div.onmousedown = function(e) {
                    selectElement(el.id);
                    let startX = e.clientX;
                    let startY = e.clientY;
                    let initialX = el.x;
                    let initialY = el.y;
                    let initialWidth = el.width;
                    let initialHeight = el.height;
                    let aspect = initialHeight / initialWidth;
                    let isResizing = e.target === handle;

                    function onMouseMove(moveEvent) {
                        let dx = moveEvent.clientX - startX;
                        let dy = moveEvent.clientY - startY;
                        if (isResizing) {
                            el.width = Math.max(30, initialWidth + dx);
                            el.height = el.width * aspect;
                        } else {
                            el.x = initialX + dx;
                            el.y = initialY + dy;
                        }
                        div.style.left = el.x + 'px';
                        div.style.top = el.y + 'px';
                        div.style.width = el.width + 'px';
                        div.style.height = el.height + 'px';
                        updateMetrics(el);
                    }

                    function onMouseUp() {
                        window.removeEventListener('mousemove', onMouseMove);
                        window.removeEventListener('mouseup', onMouseUp);
                        saveState();
                    }

                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                    e.stopPropagation();
                };

                artboard.appendChild(div);

                // Capas
                let layerItem = document.createElement('div');
                layerItem.className = 'layer-item ' + (el.id === selectedElementId ? 'active' : '');
                layerItem.innerHTML = `<span>${el.name}</span> <small>Capa ${index+1}</small>`;
                layerItem.onclick = () => selectElement(el.id);
                layersList.appendChild(layerItem);
            });
        }

        function selectElement(id) {
            selectedElementId = id;
            let el = elements.find(item => item.id === id);
            if(el) updateMetrics(el);
            renderCanvas();
        }

        function updateMetrics(el) {
            document.getElementById('element-metrics').innerText = `Medidas: ${Math.round(el.width)}px x ${Math.round(el.height)}px | Posición: X(${Math.round(el.x)}), Y(${Math.round(el.y)})`;
        }

        // --- PROCESAMIENTO DE IMAGEN ---
        function getSelectedObject() {
            return elements.find(item => item.id === selectedElementId);
        }

        function processImageCanvas(callback) {
            let el = getSelectedObject();
            if (!el) {
                alert('Por favor selecciona una imagen en el lienzo.');
                return;
            }
            let img = new Image();
            img.src = el.src;
            img.onload = function() {
                let canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                callback(canvas, ctx, el);
                el.src = canvas.toDataURL();
                saveState();
                renderCanvas();
            }
        }

        function removeBackground() {
            processImageCanvas((canvas, ctx) => {
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] > 230 && data[i+1] > 230 && data[i+2] > 230) {
                        data[i+3] = 0;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            });
        }

        function applyHalftones() {
            processImageCanvas((canvas, ctx) => {
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                let step = 8;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#000000';

                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        let idx = (y * canvas.width + x) * 4;
                        let avg = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                        let radius = (1 - avg / 255) * (step / 1.2);
